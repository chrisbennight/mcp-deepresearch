[workspace]
members = ["."]
resolver = "3"

[package]
name = "mcp-deepresearch"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "An MCP research service with durable execution and cited answers"
repository = "https://github.com/chrisbennight/mcp-deepresearch"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
schemars = { version = "1", features = ["uuid1"] }
nix = { version = "0.31", features = ["signal", "process"] }
