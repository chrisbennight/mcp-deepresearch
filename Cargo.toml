[workspace]
members = ["."]
resolver = "3"

[package]
name = "mcp-deepresearch"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"
description = "An MCP research service with durable execution and cited answers"
repository = "https://github.com/chrisbennight/mcp-deepresearch"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
schemars = { version = "1", features = ["uuid1"] }
nix = { version = "0.31", features = ["signal", "process"] }
rmcp = { version = "3", features = ["client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
axum = "0.8"
sha2 = "0.10"
base64 = "0.22"
restate-sdk = { version = "0.12", features = ["reqwest-client"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
futures-util = "0.3"
